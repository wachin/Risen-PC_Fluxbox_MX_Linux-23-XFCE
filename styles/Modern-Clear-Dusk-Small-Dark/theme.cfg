style.name:                          Modern Clear Dusk Small Dark
style.author:                        Codex for Wachin
style.date:                          2026-11-25
style.comments:                      Small modern Fluxbox theme with compact titlebar, text, and taskbar footprint. Dark variant.

background:                          Flat Solid
background.color:                    #171a1b

! Fonts
window.font:                         Noto Sans-8:bold
menu.frame.font:                     Noto Sans-8
menu.title.font:                     Noto Sans-8:bold
toolbar.font:                        Noto Sans-8
toolbar.clock.font:                  Noto Sans-8:bold
toolbar.workspace.font:              Noto Sans-8:bold
toolbar.iconbar.focused.font:        Noto Sans-8:bold
toolbar.iconbar.unfocused.font:      Noto Sans-8

! Palette

! Toolbar
toolbar:                             Flat Gradient Vertical
toolbar.color:                       #222627
toolbar.colorTo:                     #171b1c
toolbar.textColor:                   #edf1ec
toolbar.justify:                     Center
toolbar.height:                      22

toolbar.button:                      Flat Solid
toolbar.button.color:                #1f2224
toolbar.button.picColor:             #5be1d6
toolbar.button.pressed:              Flat Solid
toolbar.button.pressed.color:        #49ded2
toolbar.button.pressed.picColor:     #0b1012

toolbar.label:                       Flat Solid
toolbar.label.color:                 #1f2224
toolbar.label.textColor:             #edf1ec

toolbar.windowLabel:                 Flat Solid
toolbar.windowLabel.color:           #1b1f20
toolbar.windowLabel.textColor:       #a8b3ad

toolbar.clock:                       Flat Solid
toolbar.clock.color:                 #1b1f20
toolbar.clock.textColor:             #e2daca

toolbar.iconbar.focused:             Flat Gradient Vertical
toolbar.iconbar.focused.color:       #49ded2
toolbar.iconbar.focused.colorTo:     #48e0d7
toolbar.iconbar.focused.textColor:   #0b1012
toolbar.iconbar.focused.borderWidth: 0

toolbar.iconbar.unfocused:           Flat Solid
toolbar.iconbar.unfocused.color:     #1f2224
toolbar.iconbar.unfocused.textColor: #a8b3ad
toolbar.iconbar.unfocused.borderWidth: 0

toolbar.iconbar.empty:               Flat Solid
toolbar.iconbar.empty.color:         #1b1f20
toolbar.iconbar.borderWidth:         0

! Menu
menu.frame:                          Flat Solid
menu.frame.color:                    #1b1f20
menu.frame.textColor:                #edf1ec
menu.frame.disableColor:             #a4ada9
menu.frame.justify:                  Left

menu.title:                          Flat Gradient Vertical
menu.title.color:                    #2a2f2f
menu.title.colorTo:                  #1b1f20
menu.title.textColor:                #edf1ec
menu.title.justify:                  Center

menu.hilite:                         Flat Solid
menu.hilite.color:                   #49ded2
menu.hilite.textColor:               #0b1012

menu.bullet:                         triangle
menu.bullet.position:                Right
menu.itemHeight:                     21
menu.titleHeight:                    22
menu.bevelWidth:                     0
menu.borderWidth:                    1
menu.borderColor:                    #161b1d
menu.roundCorners:                   TopLeft TopRight BottomLeft BottomRight

! Windows
window.title.height:                 21
window.justify:                      Center

window.title.focus:                  Flat Gradient Vertical
window.title.focus.color:            #262a2c
window.title.focus.colorTo:          #15181a
window.title.unfocus:                Flat Solid
window.title.unfocus.color:          #1b1f20

window.label.focus:                  Flat Solid
window.label.focus.color:            #262a2c
window.label.focus.textColor:        #edf1ec
window.label.unfocus:                Flat Solid
window.label.unfocus.color:          #1b1f20
window.label.unfocus.textColor:      #a5aca8

window.button.focus:                 Flat Solid
window.button.focus.color:           #262a2c
window.button.focus.picColor:        #5be1d6
window.button.unfocus:               Flat Solid
window.button.unfocus.color:         #1b1f20
window.button.unfocus.picColor:      #a4ada9
window.button.pressed:               Flat Solid
window.button.pressed.color:         #e56343
window.button.pressed.picColor:      #0b1012

window.handle.focus:                 Flat Solid
window.handle.focus.color:           #15181a
window.handle.unfocus:               Flat Solid
window.handle.unfocus.color:         #15181a

window.grip.focus:                   Flat Solid
window.grip.focus.color:             #49ded2
window.grip.unfocus:                 Flat Solid
window.grip.unfocus.color:           #2a2f2f

window.frame.focusColor:             #161b1d
window.frame.unfocusColor:           #171b1c

window.tab.justify:                  Center
window.tab.label.focus:              Flat Solid
window.tab.label.focus.color:        #49ded2
window.tab.label.focus.textColor:    #0b1012
window.tab.label.unfocus:            Flat Solid
window.tab.label.unfocus.color:      #1f2224
window.tab.label.unfocus.textColor:  #a8b3ad
window.tab.borderWidth:              1
window.tab.borderColor:              #161b1d

borderColor:                         #161b1d
borderWidth:                         1
bevelWidth:                          0
frameWidth:                          1
handleWidth:                         2
