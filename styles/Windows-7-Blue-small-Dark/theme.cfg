style.name:                          Windows 7 Blue Small Dark
style.author:                        Codex for Wachin
style.date:                          2026-11-25
style.comments:                      Compact Windows 7 inspired blue Fluxbox theme for fitting more windows in the taskbar. Dark variant.

background:                          Flat Solid
background.color:                    #253749

! Fonts
window.font:                         Noto Sans-8:bold
menu.frame.font:                     Noto Sans-8
menu.title.font:                     Noto Sans-8:bold
toolbar.font:                        Noto Sans-8
toolbar.clock.font:                  Noto Sans-8:bold
toolbar.workspace.font:              Noto Sans-8:bold
toolbar.iconbar.focused.font:        Noto Sans-8:bold
toolbar.iconbar.unfocused.font:      Noto Sans-8

! Palette inspired by the default Windows 7 blue glass look.

! Toolbar
toolbar:                             Flat Gradient Vertical
toolbar.color:                       #243a4a
toolbar.colorTo:                     #1f2d39
toolbar.textColor:                   #f6f8fa
toolbar.justify:                     Center
toolbar.height:                      22

toolbar.button:                      Flat Gradient Vertical
toolbar.button.color:                #263d4d
toolbar.button.colorTo:              #20313f
toolbar.button.picColor:             #5a9fe2
toolbar.button.pressed:              Flat Gradient Vertical
toolbar.button.pressed.color:        #4aa6e8
toolbar.button.pressed.colorTo:      #47a1eb
toolbar.button.pressed.picColor:     #0b1012

toolbar.label:                       Flat Gradient Vertical
toolbar.label.color:                 #263f4d
toolbar.label.colorTo:               #233745
toolbar.label.textColor:             #f6f8fa

toolbar.windowLabel:                 Flat Gradient Vertical
toolbar.windowLabel.color:           #243a4a
toolbar.windowLabel.colorTo:         #20313f
toolbar.windowLabel.textColor:       #9db3c8

toolbar.clock:                       Flat Gradient Vertical
toolbar.clock.color:                 #263d4d
toolbar.clock.colorTo:               #213442
toolbar.clock.textColor:             #f3f6f8

toolbar.iconbar.focused:             Flat Gradient Vertical
toolbar.iconbar.focused.color:       #47b0eb
toolbar.iconbar.focused.colorTo:     #47a2eb
toolbar.iconbar.focused.textColor:   #0b1012
toolbar.iconbar.focused.borderWidth: 1
toolbar.iconbar.focused.borderColor: #55bde7

toolbar.iconbar.unfocused:           Flat Gradient Vertical
toolbar.iconbar.unfocused.color:     #243a4a
toolbar.iconbar.unfocused.colorTo:   #20313f
toolbar.iconbar.unfocused.textColor: #9db3c8
toolbar.iconbar.unfocused.borderWidth: 1
toolbar.iconbar.unfocused.borderColor: #2b3e50

toolbar.iconbar.empty:               Flat Gradient Vertical
toolbar.iconbar.empty.color:         #243746
toolbar.iconbar.empty.colorTo:       #212f3b
toolbar.iconbar.borderWidth:         0

! Menu
menu.frame:                          Flat Gradient Vertical
menu.frame.color:                    #263f4d
menu.frame.colorTo:                  #233847
menu.frame.textColor:                #f6f8fa
menu.frame.disableColor:             #a6b4bf
menu.frame.justify:                  Left

menu.title:                          Flat Gradient Vertical
menu.title.color:                    #202d39
menu.title.colorTo:                  #16212c
menu.title.textColor:                #e6e6e6
menu.title.justify:                  Center

menu.hilite:                         Flat Gradient Vertical
menu.hilite.color:                   #47b0eb
menu.hilite.colorTo:                 #47a2eb
menu.hilite.textColor:               #0b1012

menu.bullet:                         triangle
menu.bullet.position:                Right
menu.itemHeight:                     21
menu.titleHeight:                    22
menu.bevelWidth:                     1
menu.borderWidth:                    1
menu.borderColor:                    #2b3f50
menu.roundCorners:                   TopLeft TopRight BottomLeft BottomRight

! Windows
window.title.height:                 21
window.justify:                      Center

window.title.focus:                  Flat Gradient Vertical
window.title.focus.color:            #253e4b
window.title.focus.colorTo:          #1a2731
window.title.unfocus:                Flat Gradient Vertical
window.title.unfocus.color:          #2a3842
window.title.unfocus.colorTo:        #262d33

window.label.focus:                  Flat Gradient Vertical
window.label.focus.color:            #202d39
window.label.focus.colorTo:          #16212c
window.label.focus.textColor:        #e6e6e6
window.label.unfocus:                Flat Gradient Vertical
window.label.unfocus.color:          #29343c
window.label.unfocus.colorTo:        #252a2f
window.label.unfocus.textColor:      #9db4c8

window.button.focus:                 Flat Gradient Vertical
window.button.focus.color:           #263d4d
window.button.focus.colorTo:         #1f303e
window.button.focus.picColor:        #5a9fe2
window.button.unfocus:               Flat Gradient Vertical
window.button.unfocus.color:         #2a363f
window.button.unfocus.colorTo:       #262d32
window.button.unfocus.picColor:      #a2b5c3
window.button.pressed:               Flat Gradient Vertical
window.button.pressed.color:         #eb5e47
window.button.pressed.colorTo:       #e95249
window.button.pressed.picColor:      #0b1012

window.handle.focus:                 Flat Gradient Vertical
window.handle.focus.color:           #202d39
window.handle.focus.colorTo:         #16212c
window.handle.unfocus:               Flat Solid
window.handle.unfocus.color:         #262d33

window.grip.focus:                   Flat Gradient Vertical
window.grip.focus.color:             #47b0eb
window.grip.focus.colorTo:           #47a2eb
window.grip.unfocus:                 Flat Solid
window.grip.unfocus.color:           #252a2f

window.frame.focusColor:             #3786be
window.frame.unfocusColor:           #303f4a

window.tab.justify:                  Center
window.tab.label.focus:              Flat Gradient Vertical
window.tab.label.focus.color:        #47b0eb
window.tab.label.focus.colorTo:      #47a2eb
window.tab.label.focus.textColor:    #0b1012
window.tab.label.unfocus:            Flat Gradient Vertical
window.tab.label.unfocus.color:      #233847
window.tab.label.unfocus.colorTo:    #20313f
window.tab.label.unfocus.textColor:  #9db3c8
window.tab.borderWidth:              1
window.tab.borderColor:              #2b3f50

borderColor:                         #2b4050
borderWidth:                         1
bevelWidth:                          1
frameWidth:                          1
handleWidth:                         2
