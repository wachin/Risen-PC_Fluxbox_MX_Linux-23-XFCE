style.name:                          macOS Aqua Dark
style.author:                        Codex for Wachin
style.date:                          2026-11-25
style.comments:                      macOS-inspired Fluxbox theme with light chrome, blue focus, and comfortable controls. Dark variant.

background:                          Flat Solid
background.color:                    #30373e

! Fonts
window.font:                         Noto Sans-10:bold
menu.frame.font:                     Noto Sans-10
menu.title.font:                     Noto Sans-10:bold
toolbar.font:                        Noto Sans-10
toolbar.clock.font:                  Noto Sans-10:bold
toolbar.workspace.font:              Noto Sans-10:bold
toolbar.iconbar.focused.font:        Noto Sans-10:bold
toolbar.iconbar.unfocused.font:      Noto Sans-10

! Palette inspired by classic macOS Aqua and modern light macOS chrome.

! Toolbar
toolbar:                             Flat Gradient Vertical
toolbar.color:                       #303a43
toolbar.colorTo:                     #2e3439
toolbar.textColor:                   #f5f6f9
toolbar.justify:                     Center
toolbar.height:                      28

toolbar.button:                      Flat Gradient Vertical
toolbar.button.color:                #3b3b3b
toolbar.button.colorTo:              #2e3439
toolbar.button.picColor:             #cbd1d8
toolbar.button.pressed:              Flat Gradient Vertical
toolbar.button.pressed.color:        #4799eb
toolbar.button.pressed.colorTo:      #4796eb
toolbar.button.pressed.picColor:     #0b1012

toolbar.label:                       Flat Gradient Vertical
toolbar.label.color:                 #3b3b3b
toolbar.label.colorTo:               #2f373d
toolbar.label.textColor:             #f5f6f9

toolbar.windowLabel:                 Flat Gradient Vertical
toolbar.windowLabel.color:           #303840
toolbar.windowLabel.colorTo:         #2e3439
toolbar.windowLabel.textColor:       #aab3bb

toolbar.clock:                       Flat Gradient Vertical
toolbar.clock.color:                 #3b3b3b
toolbar.clock.colorTo:               #2f373d
toolbar.clock.textColor:             #f5f6f9

toolbar.iconbar.focused:             Flat Gradient Vertical
toolbar.iconbar.focused.color:       #47a1eb
toolbar.iconbar.focused.colorTo:     #4799eb
toolbar.iconbar.focused.textColor:   #0b1012
toolbar.iconbar.focused.borderWidth: 1
toolbar.iconbar.focused.borderColor: #55a4e7

toolbar.iconbar.unfocused:           Flat Gradient Vertical
toolbar.iconbar.unfocused.color:     #303a43
toolbar.iconbar.unfocused.colorTo:   #2e3439
toolbar.iconbar.unfocused.textColor: #a8b3bd
toolbar.iconbar.unfocused.borderWidth: 1
toolbar.iconbar.unfocused.borderColor: #343e47

toolbar.iconbar.empty:               Flat Gradient Vertical
toolbar.iconbar.empty.color:         #303840
toolbar.iconbar.empty.colorTo:       #2d3338
toolbar.iconbar.borderWidth:         0

! Menu
menu.frame:                          Flat Solid
menu.frame.color:                    #303a43
menu.frame.textColor:                #f5f6f9
menu.frame.disableColor:             #a9b3bc
menu.frame.justify:                  Left

menu.title:                          Flat Gradient Vertical
menu.title.color:                    #3b3b3b
menu.title.colorTo:                  #2e3439
menu.title.textColor:                #f5f6f9
menu.title.justify:                  Center

menu.hilite:                         Flat Gradient Vertical
menu.hilite.color:                   #47a1eb
menu.hilite.colorTo:                 #4799eb
menu.hilite.textColor:               #0b1012

menu.bullet:                         triangle
menu.bullet.position:                Right
menu.itemHeight:                     26
menu.titleHeight:                    28
menu.bevelWidth:                     1
menu.borderWidth:                    1
menu.borderColor:                    #343e47
menu.roundCorners:                   TopLeft TopRight BottomLeft BottomRight

! Windows
window.title.height:                 28
window.justify:                      Center

window.title.focus:                  Flat Gradient Vertical
window.title.focus.color:            #3b3b3b
window.title.focus.colorTo:          #2d3236
window.title.unfocus:                Flat Gradient Vertical
window.title.unfocus.color:          #303840
window.title.unfocus.colorTo:        #2e3338

window.label.focus:                  Flat Gradient Vertical
window.label.focus.color:            #303a43
window.label.focus.colorTo:          #2e3439
window.label.focus.textColor:        #f5f6f9
window.label.unfocus:                Flat Gradient Vertical
window.label.unfocus.color:          #30383f
window.label.unfocus.colorTo:        #2e3338
window.label.unfocus.textColor:      #abb3ba

window.button.focus:                 Flat Gradient Vertical
window.button.focus.color:           #3b3b3b
window.button.focus.colorTo:         #2e3439
window.button.focus.picColor:        #ec5851
window.button.unfocus:               Flat Gradient Vertical
window.button.unfocus.color:         #303840
window.button.unfocus.colorTo:       #2e3338
window.button.unfocus.picColor:      #a9b3bc
window.button.pressed:               Flat Gradient Vertical
window.button.pressed.color:         #eb4f47
window.button.pressed.colorTo:       #df5b53
window.button.pressed.picColor:      #0b1012

window.handle.focus:                 Flat Gradient Vertical
window.handle.focus.color:           #2e3439
window.handle.focus.colorTo:         #2c3033
window.handle.unfocus:               Flat Solid
window.handle.unfocus.color:         #2e3338

window.grip.focus:                   Flat Gradient Vertical
window.grip.focus.color:             #47a1eb
window.grip.focus.colorTo:           #4799eb
window.grip.unfocus:                 Flat Solid
window.grip.unfocus.color:           #2c3033

window.frame.focusColor:             #353e45
window.frame.unfocusColor:           #343e47

window.tab.justify:                  Center
window.tab.label.focus:              Flat Gradient Vertical
window.tab.label.focus.color:        #47a1eb
window.tab.label.focus.colorTo:      #4799eb
window.tab.label.focus.textColor:    #0b1012
window.tab.label.unfocus:            Flat Gradient Vertical
window.tab.label.unfocus.color:      #303840
window.tab.label.unfocus.colorTo:    #2e3439
window.tab.label.unfocus.textColor:  #a8b3bd
window.tab.borderWidth:              1
window.tab.borderColor:              #343e47

borderColor:                         #353e45
borderWidth:                         1
bevelWidth:                          1
frameWidth:                          1
handleWidth:                         4
