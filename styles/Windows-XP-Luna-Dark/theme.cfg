style.name:                          Windows XP Luna Dark
style.author:                        Codex for Wachin
style.date:                          2026-11-25
style.comments:                      Windows XP Luna inspired Fluxbox theme with blue chrome, green start-era accents, and comfortable sizing. Dark variant.

background:                          Flat Solid
background.color:                    #1b232c

! Fonts
window.font:                         Noto Sans-10:bold
menu.frame.font:                     Noto Sans-10
menu.title.font:                     Noto Sans-10:bold
toolbar.font:                        Noto Sans-10
toolbar.clock.font:                  Noto Sans-10:bold
toolbar.workspace.font:              Noto Sans-10:bold
toolbar.iconbar.focused.font:        Noto Sans-10:bold
toolbar.iconbar.unfocused.font:      Noto Sans-10

! Palette inspired by Windows XP Luna.

! Toolbar
toolbar:                             Flat Gradient Vertical
toolbar.color:                       #1c283a
toolbar.colorTo:                     #192233
toolbar.textColor:                   #e6e6e6
toolbar.justify:                     Center
toolbar.height:                      28

toolbar.button:                      Flat Gradient Vertical
toolbar.button.color:                #202e41
toolbar.button.colorTo:              #192233
toolbar.button.picColor:             #d1d1d1
toolbar.button.pressed:              Flat Gradient Vertical
toolbar.button.pressed.color:        #eba147
toolbar.button.pressed.colorTo:      #eb9f47
toolbar.button.pressed.picColor:     #0b1012

toolbar.label:                       Flat Gradient Vertical
toolbar.label.color:                 #1d2b3b
toolbar.label.colorTo:               #192233
toolbar.label.textColor:             #e6e6e6

toolbar.windowLabel:                 Flat Gradient Vertical
toolbar.windowLabel.color:           #1b2637
toolbar.windowLabel.colorTo:         #171e2e
toolbar.windowLabel.textColor:       #b2b2b2

toolbar.clock:                       Flat Gradient Vertical
toolbar.clock.color:                 #192332
toolbar.clock.colorTo:               #151c2a
toolbar.clock.textColor:             #e6e6e6

toolbar.iconbar.focused:             Flat Gradient Vertical
toolbar.iconbar.focused.color:       #ebbe47
toolbar.iconbar.focused.colorTo:     #eba147
toolbar.iconbar.focused.textColor:   #0b1012
toolbar.iconbar.focused.borderWidth: 1
toolbar.iconbar.focused.borderColor: #e7cc55

toolbar.iconbar.unfocused:           Flat Gradient Vertical
toolbar.iconbar.unfocused.color:     #202e41
toolbar.iconbar.unfocused.colorTo:   #1b2637
toolbar.iconbar.unfocused.textColor: #b2b2b2
toolbar.iconbar.unfocused.borderWidth: 1
toolbar.iconbar.unfocused.borderColor: #2b3850

toolbar.iconbar.empty:               Flat Gradient Vertical
toolbar.iconbar.empty.color:         #1d2b3b
toolbar.iconbar.empty.colorTo:       #171e2e
toolbar.iconbar.borderWidth:         0

! Menu
menu.frame:                          Flat Solid
menu.frame.color:                    #3f3d2d
menu.frame.textColor:                #f5f6f9
menu.frame.disableColor:             #b8b8ad
menu.frame.justify:                  Left

menu.title:                          Flat Gradient Vertical
menu.title.color:                    #1c283a
menu.title.colorTo:                  #151c2a
menu.title.textColor:                #e6e6e6
menu.title.justify:                  Center

menu.hilite:                         Flat Gradient Vertical
menu.hilite.color:                   #ebbe47
menu.hilite.colorTo:                 #eba147
menu.hilite.textColor:               #0b1012

menu.bullet:                         triangle
menu.bullet.position:                Right
menu.itemHeight:                     26
menu.titleHeight:                    28
menu.bevelWidth:                     1
menu.borderWidth:                    1
menu.borderColor:                    #2b3850
menu.roundCorners:                   TopLeft TopRight BottomLeft BottomRight

! Windows
window.title.height:                 28
window.justify:                      Center

window.title.focus:                  Flat Gradient Vertical
window.title.focus.color:            #1e2c3d
window.title.focus.colorTo:          #151c2a
window.title.unfocus:                Flat Gradient Vertical
window.title.unfocus.color:          #222e40
window.title.unfocus.colorTo:        #21262d

window.label.focus:                  Flat Gradient Vertical
window.label.focus.color:            #1c283a
window.label.focus.colorTo:          #151c2a
window.label.focus.textColor:        #e6e6e6
window.label.unfocus:                Flat Gradient Vertical
window.label.unfocus.color:          #222e40
window.label.unfocus.colorTo:        #21262d
window.label.unfocus.textColor:      #9dafc8

window.button.focus:                 Flat Gradient Vertical
window.button.focus.color:           #202e41
window.button.focus.colorTo:         #192233
window.button.focus.picColor:        #d1d1d1
window.button.unfocus:               Flat Gradient Vertical
window.button.unfocus.color:         #222e40
window.button.unfocus.colorTo:       #21262d
window.button.unfocus.picColor:      #9dafc8
window.button.pressed:               Flat Gradient Vertical
window.button.pressed.color:         #eb5547
window.button.pressed.colorTo:       #db6257
window.button.pressed.picColor:      #0b1012

window.handle.focus:                 Flat Gradient Vertical
window.handle.focus.color:           #192233
window.handle.focus.colorTo:         #151c2a
window.handle.unfocus:               Flat Solid
window.handle.unfocus.color:         #21262d

window.grip.focus:                   Flat Gradient Vertical
window.grip.focus.color:             #8cd260
window.grip.focus.colorTo:           #7cda58
window.grip.unfocus:                 Flat Solid
window.grip.unfocus.color:           #21262d

window.frame.focusColor:             #185ddc
window.frame.unfocusColor:           #4975ab

window.tab.justify:                  Center
window.tab.label.focus:              Flat Gradient Vertical
window.tab.label.focus.color:        #ebbe47
window.tab.label.focus.colorTo:      #eba147
window.tab.label.focus.textColor:    #0b1012
window.tab.label.unfocus:            Flat Gradient Vertical
window.tab.label.unfocus.color:      #202e41
window.tab.label.unfocus.colorTo:    #1b2637
window.tab.label.unfocus.textColor:  #b2b2b2
window.tab.borderWidth:              1
window.tab.borderColor:              #2b3850

borderColor:                         #2b3850
borderWidth:                         1
bevelWidth:                          1
frameWidth:                          1
handleWidth:                         4
