style.name:                          Windows 11 Light Medium Dark
style.author:                        Codex for Wachin
style.date:                          2026-11-25
style.comments:                      Compact Windows 11 light inspired Fluxbox theme. Dark variant.

background:                          Flat Solid
background.color:                    #393939

! Fonts
window.font:                         Noto Sans-9:bold
menu.frame.font:                     Noto Sans-9
menu.title.font:                     Noto Sans-9:bold
toolbar.font:                        Noto Sans-9
toolbar.clock.font:                  Noto Sans-9:bold
toolbar.workspace.font:              Noto Sans-9:bold
toolbar.iconbar.focused.font:        Noto Sans-9:bold
toolbar.iconbar.unfocused.font:      Noto Sans-9

! Palette inspired by Windows 11 light mode.

! Toolbar
toolbar:                             Flat Gradient Vertical
toolbar.color:                       #3b3b3b
toolbar.colorTo:                     #383838
toolbar.textColor:                   #f8f8f8
toolbar.justify:                     Center
toolbar.height:                      24

toolbar.button:                      Flat Solid
toolbar.button.color:                #3a3a3a
toolbar.button.picColor:             #d1d1d1
toolbar.button.pressed:              Flat Solid
toolbar.button.pressed.color:        #479ceb
toolbar.button.pressed.picColor:     #0b1012

toolbar.label:                       Flat Solid
toolbar.label.color:                 #3a3a3a
toolbar.label.textColor:             #f8f8f8

toolbar.windowLabel:                 Flat Solid
toolbar.windowLabel.color:           #393939
toolbar.windowLabel.textColor:       #b2b2b2

toolbar.clock:                       Flat Solid
toolbar.clock.color:                 #3a3a3a
toolbar.clock.textColor:             #f7f7f7

toolbar.iconbar.focused:             Flat Gradient Vertical
toolbar.iconbar.focused.color:       #479deb
toolbar.iconbar.focused.colorTo:     #47a0eb
toolbar.iconbar.focused.textColor:   #0b1012
toolbar.iconbar.focused.borderWidth: 1
toolbar.iconbar.focused.borderColor: #55a8e7

toolbar.iconbar.unfocused:           Flat Solid
toolbar.iconbar.unfocused.color:     #393939
toolbar.iconbar.unfocused.textColor: #afb2b6
toolbar.iconbar.unfocused.borderWidth: 1
toolbar.iconbar.unfocused.borderColor: #3d3d3d

toolbar.iconbar.empty:               Flat Solid
toolbar.iconbar.empty.color:         #383838
toolbar.iconbar.borderWidth:         0

! Menu
menu.frame:                          Flat Solid
menu.frame.color:                    #3b3b3b
menu.frame.textColor:                #f8f8f8
menu.frame.disableColor:             #b2b2b2
menu.frame.justify:                  Left

menu.title:                          Flat Gradient Vertical
menu.title.color:                    #3a3a3a
menu.title.colorTo:                  #383838
menu.title.textColor:                #f8f8f8
menu.title.justify:                  Center

menu.hilite:                         Flat Solid
menu.hilite.color:                   #479deb
menu.hilite.textColor:               #0b1012

menu.bullet:                         triangle
menu.bullet.position:                Right
menu.itemHeight:                     23
menu.titleHeight:                    24
menu.bevelWidth:                     0
menu.borderWidth:                    1
menu.borderColor:                    #3d3d3d
menu.roundCorners:                   TopLeft TopRight BottomLeft BottomRight

! Windows
window.title.height:                 24
window.justify:                      Center

window.title.focus:                  Flat Gradient Vertical
window.title.focus.color:            #3b3b3b
window.title.focus.colorTo:          #263b4c
window.title.unfocus:                Flat Gradient Vertical
window.title.unfocus.color:          #3a3a3a
window.title.unfocus.colorTo:        #383838

window.label.focus:                  Flat Solid
window.label.focus.color:            #3b3b3b
window.label.focus.textColor:        #f8f8f8
window.label.unfocus:                Flat Solid
window.label.unfocus.color:          #393939
window.label.unfocus.textColor:      #b2b2b2

window.button.focus:                 Flat Solid
window.button.focus.color:           #3b3b3b
window.button.focus.picColor:        #d1d1d1
window.button.unfocus:               Flat Solid
window.button.unfocus.color:         #393939
window.button.unfocus.picColor:      #b2b2b2
window.button.pressed:               Flat Solid
window.button.pressed.color:         #e65a4c
window.button.pressed.picColor:      #0b1012

window.handle.focus:                 Flat Solid
window.handle.focus.color:           #263b4c
window.handle.unfocus:               Flat Solid
window.handle.unfocus.color:         #383838

window.grip.focus:                   Flat Solid
window.grip.focus.color:             #47a4eb
window.grip.unfocus:                 Flat Solid
window.grip.unfocus.color:           #333333

window.frame.focusColor:             #1884dc
window.frame.unfocusColor:           #3d3d3d

window.tab.justify:                  Center
window.tab.label.focus:              Flat Solid
window.tab.label.focus.color:        #479deb
window.tab.label.focus.textColor:    #0b1012
window.tab.label.unfocus:            Flat Solid
window.tab.label.unfocus.color:      #393939
window.tab.label.unfocus.textColor:  #afb2b6
window.tab.borderWidth:              1
window.tab.borderColor:              #3d3d3d

borderColor:                         #2b3f50
borderWidth:                         1
bevelWidth:                          0
frameWidth:                          1
handleWidth:                         3
