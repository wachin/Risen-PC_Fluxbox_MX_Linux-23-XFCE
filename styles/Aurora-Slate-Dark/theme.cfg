style.name:                          Aurora Slate Dark
style.author:                        Codex for Wachin
style.date:                          2026-11-25
style.comments:                      Modern aurora-inspired Fluxbox theme with slate chrome, green focus, and warm accents. Dark variant.

background:                          Flat Solid
background.color:                    #12171a

! Fonts
window.font:                         Noto Sans-10:bold
menu.frame.font:                     Noto Sans-10
menu.title.font:                     Noto Sans-10:bold
toolbar.font:                        Noto Sans-10
toolbar.clock.font:                  Noto Sans-10:bold
toolbar.workspace.font:              Noto Sans-10:bold
toolbar.iconbar.focused.font:        Noto Sans-10:bold
toolbar.iconbar.unfocused.font:      Noto Sans-10


! Toolbar
toolbar:                             Flat Gradient Vertical
toolbar.color:                       #262f34
toolbar.colorTo:                     #141a1e
toolbar.textColor:                   #edf6f2
toolbar.justify:                     Center
toolbar.height:                      28

toolbar.button:                      Flat Solid
toolbar.button.color:                #1b2226
toolbar.button.picColor:             #63d995
toolbar.button.pressed:              Flat Solid
toolbar.button.pressed.color:        #53d58a
toolbar.button.pressed.picColor:     #0b1012

toolbar.label:                       Flat Solid
toolbar.label.color:                 #1b2226
toolbar.label.textColor:             #edf6f2

toolbar.windowLabel:                 Flat Solid
toolbar.windowLabel.color:           #171e22
toolbar.windowLabel.textColor:       #b9c9c1

toolbar.clock:                       Flat Solid
toolbar.clock.color:                 #171e22
toolbar.clock.textColor:             #e2dbca

toolbar.iconbar.focused:             Flat Gradient Vertical
toolbar.iconbar.focused.color:       #53d58a
toolbar.iconbar.focused.colorTo:     #4cdca9
toolbar.iconbar.focused.textColor:   #0b1012
toolbar.iconbar.focused.borderWidth: 1
toolbar.iconbar.focused.borderColor: #55e794

toolbar.iconbar.unfocused:           Flat Gradient Vertical
toolbar.iconbar.unfocused.color:     #20282d
toolbar.iconbar.unfocused.colorTo:   #171e22
toolbar.iconbar.unfocused.textColor: #b9c9c1
toolbar.iconbar.unfocused.borderWidth: 1
toolbar.iconbar.unfocused.borderColor: #151c1e

toolbar.iconbar.empty:               Flat Solid
toolbar.iconbar.empty.color:         #171e22
toolbar.iconbar.borderWidth:         0

! Menu
menu.frame:                          Flat Solid
menu.frame.color:                    #171e22
menu.frame.textColor:                #edf6f2
menu.frame.disableColor:             #a2aea9
menu.frame.justify:                  Left

menu.title:                          Flat Gradient Vertical
menu.title.color:                    #2b353a
menu.title.colorTo:                  #181f23
menu.title.textColor:                #edf6f2
menu.title.justify:                  Center

menu.hilite:                         Flat Gradient Vertical
menu.hilite.color:                   #53d58a
menu.hilite.colorTo:                 #4cdca9
menu.hilite.textColor:               #0b1012

menu.bullet:                         triangle
menu.bullet.position:                Right
menu.itemHeight:                     26
menu.titleHeight:                    28
menu.bevelWidth:                     0
menu.borderWidth:                    1
menu.borderColor:                    #141d1f
menu.roundCorners:                   TopLeft TopRight BottomLeft BottomRight

! Windows
window.title.height:                 28
window.justify:                      Center

window.title.focus:                  Flat Gradient Vertical
window.title.focus.color:            #2b353a
window.title.focus.colorTo:          #141a1e
window.title.unfocus:                Flat Solid
window.title.unfocus.color:          #181f23

window.label.focus:                  Flat Solid
window.label.focus.color:            #262f34
window.label.focus.textColor:        #edf6f2
window.label.unfocus:                Flat Solid
window.label.unfocus.color:          #181f23
window.label.unfocus.textColor:      #a1b0aa

window.button.focus:                 Flat Solid
window.button.focus.color:           #262f34
window.button.focus.picColor:        #63d995
window.button.unfocus:               Flat Solid
window.button.unfocus.color:         #181f23
window.button.unfocus.picColor:      #a2aea9
window.button.pressed:               Flat Solid
window.button.pressed.color:         #ea4d3e
window.button.pressed.picColor:      #0b1012

window.handle.focus:                 Flat Solid
window.handle.focus.color:           #12171a
window.handle.unfocus:               Flat Solid
window.handle.unfocus.color:         #12171a

window.grip.focus:                   Flat Solid
window.grip.focus.color:             #53d58a
window.grip.unfocus:                 Flat Solid
window.grip.unfocus.color:           #262f34

window.frame.focusColor:             #141d1f
window.frame.unfocusColor:           #141c1f

window.tab.justify:                  Center
window.tab.label.focus:              Flat Solid
window.tab.label.focus.color:        #53d58a
window.tab.label.focus.textColor:    #0b1012
window.tab.label.unfocus:            Flat Solid
window.tab.label.unfocus.color:      #1b2226
window.tab.label.unfocus.textColor:  #b9c9c1
window.tab.borderWidth:              1
window.tab.borderColor:              #141d1f

borderColor:                         #141d1f
borderWidth:                         1
bevelWidth:                          0
frameWidth:                          1
handleWidth:                         4
